version: '3.8'

services:
  # PostgreSQL 16 Production Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: cinebook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinebook_user
      POSTGRES_PASSWORD: cinebook_secure_password_2026
      POSTGRES_DB: cinebook_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinebook_user -d cinebook_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Distributed Caching & Fast Ephemeral Locks
  redis:
    image: redis:7-alpine
    container_name: cinebook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Server & ML Inference Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinebook_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cinebook_user:cinebook_secure_password_2026@postgres:5432/cinebook_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: cinebook_super_secret_jwt_key_interview_showcase_2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      PAYTM_ENV: STAGING
      PAYTM_MID: YOUR_PAYTM_STAGING_MID
      PAYTM_MERCHANT_KEY: YOUR_PAYTM_STAGING_KEY
      ENABLE_DEMO_PAYMENT_SIMULATOR: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             python -m app.ml.train &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # React 18 + Vite + Tailwind Frontend Served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinebook_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
